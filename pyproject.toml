[project]
name = "reliance-chronos2-news-forecasting"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chronos-forecasting==2.3.2",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "matplotlib",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "torch",
    "python-dotenv",
    "supabase"
]

[tool.vercel]
entrypoint = "api:app"